<title>개형 스피드 선생님</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* layout: 좁은 한 줄 관리 화면. 잠금 → 제한시간 → 학생 링크 → 랭킹 관리 */
:root{
  --paper:#F6F7FA; --card:#FFFFFF; --ink:#1C2433; --muted:#5B6476; --line:#D9DEE8; --grid:#E9EDF4;
  --accent:#C93A6E; --accent-soft:#FBE3EC; --ok:#1E7F55; --bad:#B9382F; --bad-soft:#FBE4E1; --gold:#B7791F;
  --f-display:"Gowun Batang","Noto Serif KR",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11151C; --card:#181D27; --ink:#E6E9F0; --muted:#9AA3B5; --line:#2B3241; --grid:#191F29;
  --accent:#F07AA5; --accent-soft:#3B1E2A; --ok:#58C793; --bad:#F2877F; --bad-soft:#3A1C1A; --gold:#E8B45A; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11151C; --card:#181D27; --ink:#E6E9F0; --muted:#9AA3B5; --line:#2B3241; --grid:#191F29;
  --accent:#F07AA5; --accent-soft:#3B1E2A; --ok:#58C793; --bad:#F2877F; --bad-soft:#3A1C1A; --gold:#E8B45A; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 40px}
.app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--f-display);font-weight:700;font-size:1.8rem;margin:0}
h2{font-family:var(--f-display);font-weight:700;font-size:1.15rem;margin:0}
.kicker{font-size:.8rem;letter-spacing:.06em;color:var(--accent);font-weight:600}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:10px}
label{font-weight:500;font-size:.92rem}
input{font:inherit;padding:9px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);min-width:0}
input:focus{outline:none;border-color:var(--accent)}
input[type=number]{width:5.5em;font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
button{font:inherit;font-weight:600;border-radius:999px;padding:9px 20px;cursor:pointer;border:1.5px solid var(--accent);background:var(--accent);color:var(--card)}
button.ghost{background:transparent;color:var(--accent)}
button.danger{border-color:var(--bad);background:var(--bad);color:var(--card)}
button.danger.ghost{background:transparent;color:var(--bad)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
button:disabled{opacity:.6;cursor:default}
.msg{margin:0;font-size:.88rem;min-height:1.3em}
.msg.err{color:var(--bad)} .msg.ok{color:var(--ok)}
.note{color:var(--muted);font-size:.85rem;margin:0}
.now{font-family:var(--f-display);font-weight:700;font-size:2.4rem;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.confirm{background:var(--bad-soft);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.confirm p{margin:0;color:var(--bad);font-weight:500}
#link{flex:1;font-size:.9rem}
ol{list-style:none;margin:0;padding:0}
li{display:grid;grid-template-columns:2em minmax(0,1fr) auto;gap:8px;padding:6px 2px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
li:last-child{border-bottom:none}
li .rk{font-family:var(--f-display);font-weight:700;color:var(--muted);text-align:center}
li:nth-child(-n+3) .rk{color:var(--gold)}
li .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
li .sc{font-weight:600}
</style>

<div class="app">
  <header>
    <span class="kicker">도함수 개형 스피드</span>
    <h1>선생님 페이지</h1>
  </header>

  <form class="panel" id="lockForm" novalidate>
    <label for="pw">비밀번호</label>
    <div class="row">
      <input type="password" id="pw" autocomplete="current-password" style="flex:1">
      <button type="submit" id="unlockBtn">들어가기</button>
    </div>
    <p class="msg err" id="lockMsg"></p>
    <p class="note">넷리파이에 등록한 TEACHER_PASSWORD 값을 넣어 주세요.</p>
  </form>

  <div id="admin" hidden style="display:flex;flex-direction:column;gap:14px">
    <section class="panel">
      <h2>제한시간</h2>
      <div class="row" style="align-items:flex-end;justify-content:space-between">
        <div><span class="note">지금 학생들에게 적용 중</span><div class="now" id="nowLimit">5초</div></div>
        <form class="row" id="limitForm" novalidate>
          <label for="limit" class="note" style="font-weight:400">새 시간</label>
          <input type="number" id="limit" min="3" max="30" step="1" value="5"><span>초</span>
          <button type="submit" id="saveBtn">바꾸기</button>
        </form>
      </div>
      <p class="msg" id="limitMsg"></p>
      <p class="note">3초에서 30초까지 정할 수 있어요. 바꾸면 그 뒤에 시작하는 게임부터 적용되고, 랭킹은 제한시간별로 따로 쌓여요. 게임 도중에 바꾸면 그 판의 기록은 등록되지 않아요.</p>
    </section>

    <section class="panel">
      <h2>학생에게 보낼 링크</h2>
      <div class="row">
        <input type="text" id="link" readonly aria-label="학생용 링크">
        <button type="button" class="ghost" id="copyBtn">복사</button>
      </div>
      <p class="msg" id="copyMsg"></p>
    </section>

    <section class="panel">
      <div class="row" style="justify-content:space-between">
        <h2>현재 랭킹 <span class="note" id="lbInfo"></span></h2>
        <button type="button" class="ghost" id="refreshBtn">새로고침</button>
      </div>
      <ol id="lb"></ol>
      <p class="note" id="lbEmpty" hidden>아직 기록이 없어요.</p>
      <div class="row" style="margin-top:6px"><button type="button" class="danger ghost" id="resetBtn">랭킹 초기화</button></div>
      <div class="confirm" id="confirmBox" hidden>
        <p>모든 제한시간의 기록을 지워요. 되돌릴 수 없어요.</p>
        <div class="row"><button type="button" class="danger" id="resetYes">모두 지우기</button><button type="button" class="ghost" id="resetNo">취소</button></div>
      </div>
      <p class="msg" id="resetMsg"></p>
    </section>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
let PW='';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function msg(id,text,kind){const e=$(id);e.textContent=text;e.className='msg'+(kind?' '+kind:'')}

async function teacher(body){
  try{const r=await fetch('/api/teacher',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:PW,...body})});
    const d=await r.json().catch(()=>({}));return {ok:r.ok,status:r.status,...d}}
  catch(e){return {ok:false,error:'서버에 연결할 수 없어요. 넷리파이에 배포된 주소에서 열어 주세요.'}}
}
async function loadLB(){
  try{const r=await fetch('/api/leaderboard',{cache:'no-store'});const d=await r.json();
    $('lbInfo').textContent=`· ${d.limit}초 · ${d.total}개 기록`;
    const ol=$('lb');ol.innerHTML='';$('lbEmpty').hidden=d.top.length>0;
    d.top.forEach((e,i)=>{const li=document.createElement('li');li.innerHTML=`<span class="rk">${i+1}</span><span class="nm">${esc(e.name)}</span><span class="sc">${e.score.toLocaleString()}</span>`;ol.appendChild(li)});
  }catch(e){$('lbInfo').textContent='· 불러오지 못했어요'}
}
function showLimit(l){$('nowLimit').textContent=l+'초';$('limit').value=l}

$('pw').addEventListener('input',()=>msg('lockMsg','','err'));
$('lockForm').addEventListener('submit',async e=>{e.preventDefault();
  const v=$('pw').value;if(!v){msg('lockMsg','비밀번호를 입력해 주세요.','err');return}
  PW=v;$('unlockBtn').disabled=true;msg('lockMsg','확인하는 중…');
  const d=await teacher({action:'check'});$('unlockBtn').disabled=false;
  if(!d.ok){PW='';msg('lockMsg',d.error||'확인하지 못했어요.','err');return}
  $('lockForm').hidden=true;$('admin').hidden=false;showLimit(d.limit);
  $('link').value=new URL('/',location.href).toString();loadLB();
});
$('limit').addEventListener('input',()=>msg('limitMsg',''));
$('limitForm').addEventListener('submit',async e=>{e.preventDefault();
  const v=Number($('limit').value);
  if(!Number.isInteger(v)||v<3||v>30){msg('limitMsg','3초에서 30초 사이의 정수로 입력해 주세요.','err');return}
  $('saveBtn').disabled=true;const d=await teacher({action:'setLimit',limit:v});$('saveBtn').disabled=false;
  if(!d.ok){msg('limitMsg',d.error||'바꾸지 못했어요.','err');return}
  showLimit(d.limit);msg('limitMsg',`제한시간을 ${d.limit}초로 바꿨어요.`,'ok');loadLB();
});
$('copyBtn').addEventListener('click',()=>{const t=$('link').value;
  const fb=()=>{$('link').focus();$('link').select();msg('copyMsg','링크를 선택해 두었어요. Ctrl+C로 복사해 주세요.')};
  try{navigator.clipboard.writeText(t).then(()=>msg('copyMsg','복사했어요.','ok'),fb)}catch(e){fb()}});
$('refreshBtn').addEventListener('click',loadLB);
$('resetBtn').addEventListener('click',()=>{$('confirmBox').hidden=false;$('resetBtn').hidden=true});
$('resetNo').addEventListener('click',()=>{$('confirmBox').hidden=true;$('resetBtn').hidden=false});
$('resetYes').addEventListener('click',async()=>{$('resetYes').disabled=true;const d=await teacher({action:'reset'});$('resetYes').disabled=false;
  $('confirmBox').hidden=true;$('resetBtn').hidden=false;
  if(!d.ok){msg('resetMsg',d.error||'초기화하지 못했어요.','err');return}
  msg('resetMsg',`기록 ${d.deleted}개를 지웠어요.`,'ok');loadLB()});
</script>
